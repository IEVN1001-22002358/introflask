{% extends "Layout.html" %}

{% block container %}
<div class="span12">
    <h2>Operaciones Básicas</h2>

    <form action="/OperasBas" method="post">
        <div class="control-group">
            <label class="control-label" for="n1">Número 1:</label>
            <div class="controls">
                <input type="number" step="any" class="input-xlarge" id="n1" name="n1" value="{{ n1 if n1 else '' }}" required>
            </div>
        </div>
        
        <div class="control-group">
            <label class="control-label" for="n2">Número 2:</label>
            <div class="controls">
                <input type="number" step="any" class="input-xlarge" id="n2" name="n2" value="{{ n2 if n2 else '' }}" required>
            </div>
        </div>

        <label class="control-label">Seleccione la operación:</label>
        
        <label class="radio">
            <input type="radio" name="operacion" value="sumar" checked> Sumar
        </label>
        
        <label class="radio">
            <input type="radio" name="operacion" value="restar"> Restar
        </label>
        
        <label class="radio">
            <input type="radio" name="operacion" value="multiplicar"> Multiplicar
        </label>

        <br>
        <button type="submit" class="btn btn-primary">Calcular</button>
    </form>

    {% if res is defined and res is not none %}
    <hr>
    <div class="alert alert-success">
        {% if res is number %}
            <h3>El resultado es: {{ "%.2f"|format(res) }}</h3>
        {% else %}
            <h3>{{ res }}</h3>
        {% endif %}
    </div>
    {% endif %}
</div>
{% endblock %}
